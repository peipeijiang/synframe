<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="376" viewBox="0 0 1280 376" role="img" aria-label="Highlights 03-04: billing-aware scheduling, model-cap slicer"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern><linearGradient id="gl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient><linearGradient id="gl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".16"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient><linearGradient id="gl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient><linearGradient id="gl4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3e635" stop-opacity=".16"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></linearGradient><linearGradient id="gl5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c084fc" stop-opacity=".16"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient><linearGradient id="gl6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".16"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient><linearGradient id="gl7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c" stop-opacity=".16"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></linearGradient><linearGradient id="gl8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs><rect width="1280" height="376" rx="18" fill="#060b14"/><rect width="1280" height="376" rx="18" fill="url(#grid)"/><g transform="translate(16 16)"><clipPath id="cl3"><rect width="616" height="344" rx="14"/></clipPath><rect width="616" height="344" rx="14" fill="#0b1324"/><g clip-path="url(#cl3)"><rect width="616" height="110" fill="url(#gl3)"/><rect width="616" height="3" fill="#fbbf24"/></g><rect x=".5" y=".5" width="615" height="343" rx="14" fill="none" stroke="#fbbf24" stroke-opacity=".4"/><text x="20" y="62" font-size="46" fill="none" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" stroke="#fbbf24" stroke-width="1.3">03</text><text x="100" y="30" font-size="11" fill="#fbbf24" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">channels.py · per_call / per_second</text><text x="100" y="56" font-size="21" fill="#f8fafc" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif" font-weight="700">Billing-aware scheduling</text><text x="100" y="78" font-size="12.5" fill="#94a3b8" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">Fill per-call clips, stop per-second ones early</text><g transform="translate(20 98)"><rect width="280" height="224" rx="10" fill="#0e182b" stroke="#1e293b"/><text x="14" y="22" font-size="10.5" fill="#e2e8f0" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">omni_flash-10s · per_call</text><rect x="14.0" y="30.0" width="73.6" height="28.0" rx="4" fill="#f43f5e"/><text x="51.8" y="48" font-size="11.5" fill="#060b14" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" text-anchor="middle">H1</text><rect x="89.6" y="30.0" width="86.2" height="28.0" rx="4" fill="#fbbf24"/><text x="133.7" y="48" font-size="11.5" fill="#060b14" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" text-anchor="middle">H2</text><rect x="177.8" y="30.0" width="86.2" height="28.0" rx="4" fill="#4ade80"/><text x="221.9" y="48" font-size="11.5" fill="#060b14" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" text-anchor="middle">H3</text><text x="14" y="78" font-size="11" fill="#94a3b8" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">→ fill all 10 s, cut into 3 hooks</text><text x="14" y="106" font-size="10.5" fill="#e2e8f0" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">minimax-h3 · per_second</text><rect x="14.0" y="114.0" width="201.6" height="28.0" rx="4" fill="#60a5fa"/><text x="114.8" y="132" font-size="11.5" fill="#060b14" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" text-anchor="middle">12 s</text><rect x="217.6" y="114.0" width="48.4" height="28.0" rx="4" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="241.8" y="132" font-size="10" fill="#64748b" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif" text-anchor="middle">skip</text><text x="14" y="162" font-size="11" fill="#94a3b8" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">→ stop once the script fits</text><rect x="14.0" y="178.0" width="252.0" height="32.0" rx="6" fill="#111827" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6"/><text x="140" y="199" font-size="10.5" fill="#fbbf24" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700" text-anchor="middle">rank = price / (p_ok × usable_s)</text></g><path d="M318 113.5 l4 4 l-4 4 l-4 -4 z" fill="#fbbf24"/><text x="332" y="122" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">Per call (omni_flash-10s): take the max,</text><text x="332" y="139.5" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">fill 10 s, cut into hooks</text><path d="M318 154.5 l4 4 l-4 4 l-4 -4 z" fill="#fbbf24"/><text x="332" y="163.0" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">Per second (MiniMax H3): take the</text><text x="332" y="180.5" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">shortest fit, buy only what you need</text><path d="M318 195.5 l4 4 l-4 4 l-4 -4 z" fill="#fbbf24"/><text x="332" y="204.0" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">Channels rank by cost per usable second:</text><text x="332" y="221.5" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">price ÷ (success × usable s)</text><path d="M318 236.5 l4 4 l-4 4 l-4 -4 z" fill="#fbbf24"/><text x="332" y="245.0" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">Quotes use the priciest usable channel;</text><text x="332" y="262.5" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">unknown caps need verification</text><rect x="316.0" y="298.0" width="114.7" height="24.0" rx="12" fill="#fbbf24" opacity="0.1"/><rect x="316.0" y="298.0" width="114.7" height="24.0" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.55"/><text x="329" y="314" font-size="11" fill="#fbbf24" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">prices/*.json</text></g><g transform="translate(648 16)"><clipPath id="cl4"><rect width="616" height="344" rx="14"/></clipPath><rect width="616" height="344" rx="14" fill="#0b1324"/><g clip-path="url(#cl4)"><rect width="616" height="110" fill="url(#gl4)"/><rect width="616" height="3" fill="#a3e635"/></g><rect x=".5" y=".5" width="615" height="343" rx="14" fill="none" stroke="#a3e635" stroke-opacity=".4"/><text x