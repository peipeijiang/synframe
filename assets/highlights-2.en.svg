font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" text-anchor="middle">u5</text><rect x="212.2" y="46.0" width="47.6" height="24.0" rx="4" fill="#65a30d"/><text x="236.0" y="62" font-size="10" fill="#060b14" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" text-anchor="middle">u6</text><path d="M14.0 40 v-6 h122.0 v6" stroke="#a3e635" fill="none" stroke-width="1.3"/><rect x="131.8" y="46.0" width="4.2" height="24.0" rx="2" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/><text x="76.0" y="88" font-size="9.5" fill="#94a3b8" font-family="SF Mono,Menlo,Consolas,monospace" text-anchor="middle">clip 1 · trim 9.5</text><path d="M144.0 40 v-6 h122.0 v6" stroke="#a3e635" fill="none" stroke-width="1.3"/><rect x="261.8" y="46.0" width="4.2" height="24.0" rx="2" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/><text x="206.0" y="88" font-size="9.5" fill="#94a3b8" font-family="SF Mono,Menlo,Consolas,monospace" text-anchor="middle">clip 2 · trim 9.5</text><rect x="14.0" y="106.0" width="148.8" height="24.0" rx="4" fill="#450a0a" stroke="#f87171" stroke-width="1.2"/><text x="88.4" y="122" font-size="10" fill="#fecaca" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" text-anchor="middle">u7 · 12 s</text><line x1="138.0" y1="98" x2="138.0" y2="138" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/><text x="14" y="154" font-size="10.5" fill="#f87171" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif" font-weight="700">✕ over max: split at a natural pause</text><rect x="14.0" y="166.0" width="252.0" height="26.0" rx="6" fill="#111827" stroke="#a3e635" stroke-width="1" stroke-opacity="0.6"/><text x="140" y="183" font-size="10.5" fill="#a3e635" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700" text-anchor="middle">a_roll = ceil(words / 2.85 + 1)</text><text x="14" y="210" font-size="9.5" fill="#64748b" font-family="SF Mono,Menlo,Consolas,monospace">unsourced cap → needs_verification</text></g><path d="M318 113.5 l4 4 l-4 4 l-4 -4 z" fill="#a3e635"/><text x="332" y="122" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">Timed script units are packed in order,</text><text x="332" y="139.5" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">never over the model maximum</text><path d="M318 154.5 l4 4 l-4 4 l-4 -4 z" fill="#a3e635"/><text x="332" y="163.0" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">A unit over the maximum raises an error:</text><text x="332" y="180.5" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">split it at a natural pause</text><path d="M318 195.5 l4 4 l-4 4 l-4 -4 z" fill="#a3e635"/><text x="332" y="204.0" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">A-roll length uses a measured es-MX 2.85</text><text x="332" y="221.5" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">words/s plus 1 s, rounded up</text><path d="M318 236.5 l4 4 l-4 4 l-4 -4 z" fill="#a3e635"/><text x="332" y="245.0" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">Clips record generation length and trim</text><text x="332" y="262.5" font-size="12.5" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">point; unsourced caps are flagged</text><rect x="316.0" y="298.0" width="107.8" height="24.0" rx="12" fill="#a3e635" opacity="0.1"/><rect x="316.0" y="298.0" width="107.8" height="24.0" rx="12" fill="none" stroke="#a3e635" stroke-width="1" stroke-opacity="0.55"/><text x="329" y="314" font-size="11" fill="#a3e635" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">trim_out_sec</text></g></svg>
