="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">过模型单次上限</text><path d="M318 156.5 l4 4 l-4 4 l-4 -4 z" fill="#a3e635"/><text x="332" y="165.0" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">单个单元超限直接报错，要求在自然停顿处</text><text x="332" y="183.5" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">拆开</text><path d="M318 199.5 l4 4 l-4 4 l-4 -4 z" fill="#a3e635"/><text x="332" y="208.0" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">A-roll 时长按实测 es-MX 语速 2.85 词/秒</text><text x="332" y="226.5" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">加 1 秒余量，向上取整</text><path d="M318 242.5 l4 4 l-4 4 l-4 -4 z" fill="#a3e635"/><text x="332" y="251.0" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">每段记录生成时长和裁切点；上限无来源即</text><text x="332" y="269.5" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">待核验</text><rect x="316.0" y="298.0" width="107.8" height="24.0" rx="12" fill="#a3e635" opacity="0.1"/><rect x="316.0" y="298.0" width="107.8" height="24.0" rx="12" fill="none" stroke="#a3e635" stroke-width="1" stroke-opacity="0.55"/><text x="329" y="314" font-size="11" fill="#a3e635" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">trim_out_sec</text></g></svg>
