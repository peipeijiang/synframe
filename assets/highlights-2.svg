 CJK SC,Helvetica Neue,Arial,sans-serif">→ 拍满 10 秒，切成 3 段 Hook</text><text x="14" y="106" font-size="10.5" fill="#e2e8f0" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">minimax-h3 · per_second</text><rect x="14.0" y="114.0" width="201.6" height="28.0" rx="4" fill="#60a5fa"/><text x="114.8" y="132" font-size="11.5" fill="#060b14" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" text-anchor="middle">12 s</text><rect x="217.6" y="114.0" width="48.4" height="28.0" rx="4" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="241.8" y="132" font-size="10" fill="#64748b" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif" text-anchor="middle">不买</text><text x="14" y="162" font-size="11" fill="#94a3b8" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">→ 够用即停，多余的秒数不买</text><rect x="14.0" y="178.0" width="252.0" height="32.0" rx="6" fill="#111827" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6"/><text x="140" y="199" font-size="10.5" fill="#fbbf24" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700" text-anchor="middle">rank = price / (p_ok × usable_s)</text></g><path d="M318 113.5 l4 4 l-4 4 l-4 -4 z" fill="#fbbf24"/><text x="332" y="122" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">按次计费（omni_flash-10s）取最大时长：</text><text x="332" y="140.5" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">10 秒拍满，切成多段 Hook</text><path d="M318 156.5 l4 4 l-4 4 l-4 -4 z" fill="#fbbf24"/><text x="332" y="165.0" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">按秒计费（MiniMax H3）取最短可用时长，</text><text x="332" y="183.5" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">只买需要的秒数</text><path d="M318 199.5 l4 4 l-4 4 l-4 -4 z" fill="#fbbf24"/><text x="332" y="208.0" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">渠道按每可用秒成本排序：价格 ÷（成功率 ×</text><text x="332" y="226.5" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">可用秒数）</text><path d="M318 242.5 l4 4 l-4 4 l-4 -4 z" fill="#fbbf24"/><text x="332" y="251.0" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">报价取最贵的可用渠道；上限未知标</text><text x="332" y="269.5" font-size="13" fill="#e2e8f0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">needs_verification</text><rect x="316.0" y="298.0" width="114.7" height="24.0" rx="12" fill="#fbbf24" opacity="0.1"/><rect x="316.0" y="298.0" width="114.7" height="24.0" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.55"/><text x="329" y="314" font-size="11" fill="#fbbf24" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">prices/*.json</text></g><g transform="translate(648 16)"><clipPath id="cl4"><rect width="616" height="344" rx="14"/></clipPath><rect width="616" height="344" rx="14" fill="#0b1324"/><g clip-path="url(#cl4)"><rect width="616" height="110" fill="url(#gl4)"/><rect width="616" height="3" fill="#a3e635"/></g><rect x=".5" y=".5" width="615" height="343" rx="14" fill="none" stroke="#a3e635" stroke-opacity=".4"/><text x="20" y="62" font-size="46" fill="none" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="800" stroke="#a3e635" stroke-width="1.3">04</text><text x="100" y="30" font-size="11" fill="#a3e635" font-family="SF Mono,Menlo,Consolas,monospace" font-weight="700">pla